services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dnd_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dnd_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_rag_local_dev}
      POSTGRES_DB: dnd_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  vllm:
    image: vllm/vllm-openai:latest
    container_name: dnd_rag_vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # Model Runner V2 requires CUDA UVA (pinned memory), which vLLM disables under WSL2 —
      # crashes with "RuntimeError: UVA is not available". Force the legacy V1 runner instead.
      - VLLM_USE_V2_MODEL_RUNNER=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model=Qwen/Qwen2.5-14B-Instruct-AWQ
      - --quantization=awq_marlin
      - --max-model-len=8192
      - --gpu-memory-utilization=0.85
      - --dtype=float16
      - --served-model-name=qwen2.5-14b-awq
      - --no-async-scheduling
      - --enforce-eager

volumes:
  pgdata:
  huggingface_cache:
