[tool.poetry]
name = "dnd-rag-assistant"
version = "0.1.0"
description = "Local RAG system over D&D rulebooks, served by a local Qwen model via vLLM"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
python-multipart = "^0.0.12"
pydantic-settings = "^2.6"
psycopg = {extras = ["binary"], version = "^3.2"}
psycopg-pool = "^3.2"
pgvector = "^0.3"
pymupdf = "^1.24"
sentence-transformers = "^5.0"
httpx = "^0.27"
openai = "^1.55"
torch = {version = "2.13.0", source = "pytorch-cu132"}

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
